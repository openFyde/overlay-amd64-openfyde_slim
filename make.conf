CHROMEOS_KERNEL_CONFIG="/mnt/host/source/src/overlays/overlay-amd64-openfyde_slim/kconfig/openfyde_r150-6_12-def-r1"

USE="${USE} -kernel-5_15 -kernel-5_4 -kernel-4_19 -kernel-6_6 kernel-6_12"
USE="${USE} intel_lpe kvm_nested -libglvnd llvm native_gpu_memory_buffers"
USE="${USE} libglvnd hybrid_codec vulkan intel-slim"
USE="${USE} -gpu_sandbox_start_early"
# Repack the ARC container images to xz. The rootfs on this board is too small
# for the zstd images the AOSP build emits (~97MB larger), so the size is worth
# the cost: xz is decompressed in the kernel on every cold page-in of the
# container image, measured at 9287ms to start a cold WebView renderer against
# 24ms on zstd. Boards with room should leave this unset.
USE="${USE} repack-xz"

VIDEO_CARDS="intel i965 iris iHD iHD_g8 nouveau radeon radeonsi amdgpu"
#MAKEOPTS="-j16 --load-average=16"
